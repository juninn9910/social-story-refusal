<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fd8ff">
<title>내 마음 말하기 정글 모험</title>
<style>
:root{--ink:#4a2b1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fdc7a;
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#bg,#stage,#overlay{position:absolute;inset:0}
#bg svg{width:100%;height:100%;display:block}
#bg img{width:100%;height:100%;object-fit:cover;display:block}
#stage{z-index:2}
#confetti{position:absolute;inset:0;z-index:6;pointer-events:none}
#overlay{z-index:10;pointer-events:none;display:flex;align-items:center;justify-content:center;transition:background .3s}
#overlay.show{pointer-events:auto}
#overlay.dim{background:rgba(25,55,20,.42)}

/* 배경 움직임 */
.sway{transform-box:fill-box;transform-origin:50% 60%;animation:sway 4s ease-in-out infinite alternate}
.leafTop{transform-box:fill-box;transform-origin:0 50%;animation:sway 5s ease-in-out infinite alternate}
.cloud{animation:drift 26s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(70px)}}

/* 캐릭터 */
.char{position:absolute;bottom:7vh;height:min(46vh,40vw);aspect-ratio:200/240;z-index:3}
.char.pos-left{left:5vw}
.char.pos-right{right:5vw}
.char.pos-near{left:calc(5vw + min(46vh,40vw) * 0.8)}
.mover,.inner{position:absolute;inset:0}
.mover{transform-origin:50% 100%}
.inner{transform-origin:50% 100%}
.inner svg,.inner img,.pick-char svg,.layer > svg{width:100%;height:100%;display:block;overflow:visible}
.char-img{object-fit:contain}

.armL,.armR{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pose-up .armL{transform:rotate(140deg)} .pose-up .armR{transform:rotate(-140deg)}
.pose-stop .armR{transform:rotate(-125deg)}
.pose-throw .armR{transform:rotate(-155deg)} .pose-throw .armL{transform:rotate(25deg)}
.pose-push .armR{transform:rotate(-62deg)} .pose-push .armL{transform:rotate(-112deg)}
.reach .armL{transform:rotate(62deg)}
.reachR .armR{transform:rotate(-62deg)}
.pose-raise .armR{transform:rotate(-150deg)}
/* 팔로 X — 평소 팔은 숨기고 가슴 앞에서 엇갈린 팔을 보여 줌 */
.xarms{display:none}
.pose-x .xarms{display:inline}
.pose-x .armL,.pose-x .armR{display:none}
.breathe{animation:breathe 1.3s ease-in-out}
.breathe-loop{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}45%{transform:scale(1.07,1.05)}}
.wave .armR{animation:waveR .45s ease-in-out infinite alternate}
.poke .armL{animation:pokeA .35s ease-in-out infinite alternate}
.cheer .armL{animation:cheerL .35s ease-in-out infinite alternate}
.cheer .armR{animation:cheerR .35s ease-in-out infinite alternate}
.wave-hi .armR{animation:waveR .4s ease-in-out infinite alternate}
@keyframes waveR{from{transform:rotate(-95deg)}to{transform:rotate(-140deg)}}
@keyframes pokeA{from{transform:rotate(45deg)}to{transform:rotate(76deg)}}
@keyframes cheerL{from{transform:rotate(110deg)}to{transform:rotate(150deg)}}
@keyframes cheerR{from{transform:rotate(-110deg)}to{transform:rotate(-150deg)}}

.bob{animation:bob 1.6s ease-in-out infinite}
.shake-no{animation:shakeNo .5s ease-in-out infinite}
.jump{animation:jump .65s cubic-bezier(.3,.7,.4,1) infinite}
.poke-move{animation:pokeMove .7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2.5%) scale(1.01,.99)}}
@keyframes shakeNo{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.03,.97)}45%{transform:translateY(-16%) scale(.97,1.03)}}
@keyframes pokeMove{0%,100%{transform:translateX(0)}50%{transform:translateX(-7%) rotate(-3deg)}}

.enter-right{animation:enterRight 1.3s cubic-bezier(.25,.8,.35,1) both}
.enter-left{animation:enterLeft 1s cubic-bezier(.25,.8,.35,1) both}
.exit-right{animation:exitRight 1.2s ease-in both}
.lean-in{transform:translateX(-10%) rotate(-5deg);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.recoil{animation:recoil .8s cubic-bezier(.3,1.4,.5,1) both}
.jolt{animation:jolt .3s ease-out}
.flinch{animation:flinch .5s ease-out both}
@keyframes enterRight{0%{transform:translate(70vw,0)}15%{transform:translate(56vw,-7%)}30%{transform:translate(42vw,0)}45%{transform:translate(29vw,-7%)}60%{transform:translate(17vw,0)}75%{transform:translate(7vw,-5%)}88%{transform:translate(1vw,0)}100%{transform:translate(0,0)}}
@keyframes enterLeft{0%{transform:translate(-50vw,0)}25%{transform:translate(-34vw,-7%)}50%{transform:translate(-18vw,0)}75%{transform:translate(-6vw,-5%)}100%{transform:translate(0,0)}}
@keyframes exitRight{0%{transform:translate(0,0)}20%{transform:translate(8vw,-6%)}40%{transform:translate(22vw,0)}60%{transform:translate(38vw,-6%)}80%{transform:translate(55vw,0)}100%{transform:translate(85vw,0)}}
@keyframes recoil{0%{transform:translateX(-10%) rotate(-5deg)}35%{transform:translateX(22%) rotate(12deg)}100%{transform:translateX(16%) rotate(3deg)}}
@keyframes jolt{0%{transform:translateX(0)}30%{transform:translateX(-4%) rotate(-3deg)}100%{transform:translateX(0)}}
@keyframes flinch{0%{transform:translateX(0)}40%{transform:translateX(10%) rotate(6deg)}100%{transform:translateX(6%) rotate(2deg)}}

.char.tap-me .inner::after{content:"";position:absolute;left:12%;right:12%;top:8%;height:58%;border-radius:50%;border:1vmin dashed #fff;box-shadow:0 0 0 .6vmin rgba(255,224,0,.7);animation:pulse 1s ease-in-out infinite}

/* 소품 */
.prop{position:absolute;z-index:2}
.prop svg,.prop img{width:100%;height:auto;display:block}
.prop.held{left:-26%;top:44%;width:40%;animation:wiggle 1.2s ease-in-out infinite}
.prop.hold-stop{left:62%;top:-22%;width:52%;animation:popIn .4s cubic-bezier(.3,1.6,.5,1) both}
.toys{position:absolute;bottom:6vh;left:calc(5vw + min(46vh,40vw) * 0.72);display:flex;align-items:flex-end;gap:1vw;z-index:4}
.toy{width:min(20vh,17vw)} .toy.clay{width:min(18vh,15vw)}
.toy svg,.toy img{width:100%;height:auto;display:block}
.toys.play .toy{animation:wiggle 1.4s ease-in-out infinite} .toys.play .toy.clay{animation-delay:.3s}
.toys.tug{animation:tug .35s ease-in-out infinite}
.toys.safe .toy{animation:hop .6s ease-out 2}
@keyframes tug{0%,100%{transform:translateX(0)}50%{transform:translateX(1.2vw)}}

/* 말풍선·효과 */
.bubble{position:absolute;bottom:88%;background:#fff;border:.6vmin solid var(--ink);border-radius:4vmin;padding:1.4vmin 2vmin;display:flex;flex-direction:column;align-items:center;z-index:5;animation:popIn .4s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 .8vmin 0 rgba(0,0,0,.15)}
.bubble.right{left:58%} .bubble.left{right:58%}
.bubble::after{content:"";position:absolute;bottom:-1.9vmin;width:3vmin;height:3vmin;background:#fff;border-right:.6vmin solid var(--ink);border-bottom:.6vmin solid var(--ink);transform:rotate(45deg)}
.bubble.right::after{left:3vmin} .bubble.left::after{right:3vmin}
.b-icon{width:min(13vh,11vw)} .b-icon svg,.b-icon img{width:100%;height:auto;display:block}
.b-text{font-size:min(4.6vh,3.4vw);color:var(--ink);font-weight:900;line-height:1.25;text-align:center;white-space:normal;word-break:keep-all;width:max-content;max-width:min(34vw,60vh)}
.bubble.answer{border-color:#c0392b;border-width:.8vmin}
.bubble.answer .b-text{color:#c0392b;margin-top:.6vh}
.emote{position:absolute;left:62%;top:-4%;width:22%;z-index:6;animation:emoteUp 1.8s ease-out both;pointer-events:none}
.emote svg{width:100%;height:auto;display:block}
@keyframes emoteUp{0%{transform:translateY(20%) scale(.3);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translateY(-40%) scale(1);opacity:0}}
.spark{position:absolute;width:5vmin;height:5vmin;margin:-2.5vmin;z-index:7;pointer-events:none;animation:spark 1.1s ease-out both}
.spark svg,.pokefx svg,.floaty-icon svg{width:100%;height:100%;display:block}
@keyframes spark{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(180deg);opacity:0}}
.pokefx{position:absolute;width:7vmin;height:7vmin;margin:-3.5vmin;z-index:7;pointer-events:none;animation:pokefx .5s ease-out both}
@keyframes pokefx{0%{transform:scale(.2) rotate(0);opacity:1}100%{transform:scale(1.2) rotate(40deg);opacity:0}}
.floaty-icon{position:absolute;width:7vmin;height:7vmin;margin-left:-3.5vmin;z-index:7;pointer-events:none;animation:floatUp 2s ease-out both}
@keyframes floatUp{0%{transform:translateY(0) scale(.3);opacity:0}20%{opacity:1;transform:translateY(-2vh) scale(1.1)}100%{transform:translateY(-16vh) scale(1);opacity:0}}

/* 공통 키프레임 */
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes popOut{to{transform:scale(0);opacity:0}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3vh)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* 나무 판자 */
.wood{background:repeating-linear-gradient(175deg,rgba(255,255,255,.07) 0 .8vmin,rgba(0,0,0,.05) .8vmin 2vmin),linear-gradient(180deg,#e0a35a,#b8733a);
  border:.9vmin solid #7a4a22;border-radius:3.5vmin;box-shadow:inset 0 .6vmin 0 rgba(255,255,255,.35),0 1.2vmin 0 #6b3f1c,0 2.4vmin 3vmin rgba(0,0,0,.25);color:#fff8e6;text-shadow:0 .45vmin 0 #6b3f1c}

/* 인트로 */
.title{position:absolute;top:5vh;left:50%;padding:2.2vh 6vw 2.6vh;text-align:center;white-space:nowrap;transform-origin:50% -10vh;animation:titleDrop 1s cubic-bezier(.3,1.5,.5,1) both,swing 4s 1s ease-in-out infinite;z-index:4}
.title::before,.title::after{content:"";position:absolute;top:-9vh;width:.9vmin;height:9vh;background:#8a5a2b;border-radius:1vmin}
.title::before{left:18%} .title::after{right:18%}
@keyframes titleDrop{0%{transform:translate(-50%,-45vh)}100%{transform:translate(-50%,0)}}
@keyframes swing{0%,100%{transform:translate(-50%,0) rotate(-1.5deg)}50%{transform:translate(-50%,0) rotate(1.5deg)}}
.t-top{font-size:min(5vh,4.2vw);font-weight:800;letter-spacing:.1em}
.t-main{font-size:min(11vh,9vw);font-weight:900;line-height:1.05}
.startBtn{position:absolute;left:50%;top:62%;width:min(26vh,26vw);aspect-ratio:1;margin-left:calc(min(26vh,26vw) / -2);margin-top:calc(min(26vh,26vw) / -2);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#a8f584,#3fb43a 70%);border:1.2vmin solid #fff;box-shadow:0 1.4vmin 0 #2a8a2a,0 3vh 5vh rgba(0,0,0,.3);animation:pulse 1.4s ease-in-out infinite;z-index:5;display:flex;align-items:center;justify-content:center}
.startBtn svg{width:50%;margin-left:8%}
.startBtn.gone{animation:popOut .35s both;pointer-events:none}
.picks{position:absolute;left:0;right:0;top:42vh;display:flex;justify-content:center;gap:4vw;z-index:5}
.pick{position:relative;width:min(30vh,26vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fffdf2 55%,#ffe7b0);border:1.2vmin solid var(--c);
  box-shadow:0 1.2vmin 0 rgba(0,0,0,.18),0 2.5vh 4vh rgba(0,0,0,.25);animation:popIn .5s cubic-bezier(.3,1.6,.5,1) both}
.pick-char{position:absolute;left:8%;right:8%;bottom:6%;top:-16%;animation:bob 1.6s ease-in-out infinite}
.pick:nth-child(2) .pick-char{animation-delay:.3s} .pick:nth-child(3) .pick-char{animation-delay:.6s}
.pick-name{position:absolute;bottom:-5.5vh;left:0;right:0;font-size:min(3vh,2.6vw);color:#fff;text-shadow:0 2px 0 #5a3218,0 0 6px rgba(0,0,0,.4);font-weight:800}
.pick.chosen{animation:chosenPick .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes chosenPick{to{transform:scale(1.25)}}
.pick.out{transition:.4s;opacity:0;transform:scale(.5)}
.tpanel{position:absolute;left:1vw;bottom:1vh;z-index:20;display:flex;flex-direction:column;gap:5px;font-size:12px;color:#fff;text-shadow:0 1px 2px #000}
.tp-sum{background:rgba(40,25,10,.6);padding:4px 10px;border-radius:8px;align-self:flex-start;font-size:13px}
.tp-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tpanel button{background:rgba(255,255,255,.92);color:#5a3218;border:1.5px solid #7a4a22;border-radius:8px;padding:5px 9px;font-size:12px;text-shadow:none}
.tp-row:nth-child(2) button{font-size:14px;padding:7px 12px;font-weight:800}
.warn{position:absolute;left:1vw;bottom:16vh;z-index:20;max-width:46vw;background:rgba(255,245,220,.95);border:1.5px solid #c0392b;border-radius:8px;padding:6px 10px;font-size:12px;color:#7a2a1a}

/* 챕터 카드 */
.chapcard{position:absolute;left:50%;top:38%;z-index:8;display:flex;align-items:center;gap:3vw;padding:3vh 5vw;transform:translate(-50%,-50%);animation:ccIn .6s cubic-bezier(.3,1.5,.5,1) both}
.cc-num{width:min(16vh,13vw);aspect-ratio:1;border-radius:50%;background:#fff8e6;color:#b8733a;display:flex;align-items:center;justify-content:center;font-size:min(11vh,9vw);font-weight:900;text-shadow:none;border:.8vmin solid #7a4a22}
.cc-icon{width:min(16vh,13vw)} .cc-icon svg{width:100%;height:auto;display:block}
.chapcard.out{animation:ccOut .45s ease-in both}
@keyframes ccIn{0%{transform:translate(-50%,-160%) rotate(-8deg);opacity:0}100%{transform:translate(-50%,-50%) rotate(0);opacity:1}}
@keyframes ccOut{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) scale(.3);opacity:0}}

/* 선택 카드 */
.choices{display:flex;gap:5vw;align-items:center;justify-content:center}
.card{position:relative;width:min(40vw,60vh);aspect-ratio:1/1.08;background:linear-gradient(#fffdf5,#fff3d6);border-radius:5vmin;border:1.1vmin solid #e7a955;
  box-shadow:0 1.4vmin 0 #b9772f,0 3vh 5vh rgba(0,0,0,.3);animation:cardIn .55s cubic-bezier(.3,1.5,.5,1) both,floaty 2.6s ease-in-out infinite;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .3s,filter .3s}
.card .card-art{position:relative;width:92%;aspect-ratio:1/1}
.layer{position:absolute}
.layer > .inner{position:absolute;inset:0}
.card-note{position:absolute;bottom:1.1vh;font-size:min(2.2vh,2vw);color:#9a7448}
.card.nope{animation:nope .5s ease-in-out;filter:saturate(.45) brightness(.96)}
.card.hint{border-color:#ffd000;box-shadow:0 1.4vmin 0 #d4a100,0 0 0 1.4vmin rgba(255,224,0,.55),0 0 8vmin #ffe14d;animation:hintPulse 1s ease-in-out infinite}
.card.chosen{animation:chosen .6s cubic-bezier(.3,1.6,.5,1) both;border-color:#55c24a}
.card.fade{opacity:.25;filter:grayscale(.6)}
.flyer{animation:flyer 1s ease-in-out infinite}
@keyframes cardIn{0%{transform:translateY(40vh) scale(.6);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2vh)}}
@keyframes nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-2vw) rotate(-2deg)}40%{transform:translateX(1.6vw) rotate(2deg)}60%{transform:translateX(-1vw)}80%{transform:translateX(.6vw)}}
@keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes chosen{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1.08)}}
@keyframes flyer{0%,100%{transform:translate(0,0) rotate(20deg)}50%{transform:translate(6%,-6%) rotate(40deg)}}

/* 교사 게이트 */
.gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh}
.gate-board{display:flex;align-items:center;gap:3vw;padding:3vh 4vw;background:#fffaf0;border-radius:5vmin;border:1vmin solid #ffd36b;box-shadow:0 1.4vmin 0 #e0a83a,0 3vh 6vh rgba(0,0,0,.3);animation:popIn .5s cubic-bezier(.3,1.5,.5,1) both}
.gate-hero{position:relative;width:min(30vh,26vw);aspect-ratio:200/240}
.gate-right{display:flex;flex-direction:column;align-items:center;gap:2.4vh}
.gate-icon{width:min(15vh,13vw)} .gate-icon svg{width:100%;height:auto;display:block}
.chips{display:flex;gap:1.4vw}
.chip{font-size:min(10vh,8vw);font-weight:900;color:#8a5a2a;background:#fff;border:.8vmin solid #f0c27a;border-radius:2.5vmin;padding:.4vh 2vw;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s;white-space:nowrap}
.chip.lit{background:#ffe066;transform:scale(1.15) translateY(-1vh);color:#c0392b;border-color:#f4a91d}
.gate.listening .chips{animation:listen 1.6s ease-in-out infinite}
@keyframes listen{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.replay{width:min(13vh,11vw);aspect-ratio:1;border-radius:50%;background:#4fc3f7;border:.8vmin solid #fff;box-shadow:0 1vmin 0 #2b8fc4;display:flex;align-items:center;justify-content:center}
.replay svg{width:62%}
.replay:active{transform:scale(.94)}
.gate-note{font-size:min(2.4vh,16px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.teacher-next{position:fixed;top:1.2vh;right:1.2vw;z-index:40;background:rgba(255,255,255,.94);border:2px solid #7a4a22;border-radius:12px;padding:8px 14px;font-size:15px;color:#5a3218;overflow:hidden;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.teacher-next small{font-size:11px;opacity:.7}
.fill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#8fe07a;transform:scaleX(0);transform-origin:left;z-index:0}
.lbl{position:relative;z-index:1}

/* 큰 행동 버튼 (팔로 X · 숨쉬기 · 하지 마세요) */
.bigbtn{position:absolute;left:73vw;top:44vh;width:min(34vh,24vw);aspect-ratio:1;margin-left:calc(min(34vh,24vw) / -2);margin-top:calc(min(34vh,24vw) / -2);z-index:6;transform:scale(var(--s,1));transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .5s}
.bs-a{width:100%;height:100%;animation:popIn .5s cubic-bezier(.3,1.6,.5,1) both}
.bs-b{width:100%;height:100%;filter:drop-shadow(0 1.4vmin 0 rgba(0,0,0,.25))}
.bs-b svg,.bs-b img{width:100%;height:100%;display:block}
.bigbtn.ready:not(.busy) .bs-b{animation:pulse 1.1s ease-in-out infinite}
.bigbtn.busy .bs-b{filter:drop-shadow(0 1.4vmin 0 rgba(0,0,0,.25)) brightness(.88)}
.bigbtn.hit .bs-b{animation:hit .4s ease-out}
.bigbtn.done{opacity:0;transform:scale(2);pointer-events:none}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(.86)}100%{transform:scale(1)}}

/* 엔딩 */
.party{position:absolute;left:0;right:0;bottom:6vh;display:flex;justify-content:center;align-items:flex-end;gap:1vw;z-index:4}
.pc{position:relative;width:min(20vh,16vw);aspect-ratio:200/240}
.pc.hero{width:min(30vh,22vw)}
.pc .inner{animation:jump .7s cubic-bezier(.3,.7,.4,1) infinite}
.stamp{position:absolute;left:50%;top:3vh;width:min(36vh,30vw);margin-left:calc(min(36vh,30vw) / -2);z-index:7;animation:stamp .5s cubic-bezier(.5,0,.5,1.3) both}
.stamp svg{width:100%;height:auto;display:block}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg);opacity:0}70%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.againBtn{position:absolute;right:4vw;top:12vh;z-index:8;display:flex;flex-direction:column;align-items:center;gap:1vh;animation:popIn .5s cubic-bezier(.3,1.6,.5,1) both}
.againBtn .ab{width:min(16vh,14vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8f584,#3fb43a 70%);border:1vmin solid #fff;box-shadow:0 1.2vmin 0 #2a8a2a;display:flex;align-items:center;justify-content:center;animation:pulse 1.4s ease-in-out infinite}
.againBtn .ab svg{width:60%}
.againBtn span{font-size:min(2.2vh,15px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.teacherLog{position:absolute;left:1vw;top:5.5vh;z-index:20;background:rgba(255,255,255,.9);border:1.5px solid #7a4a22;border-radius:10px;padding:8px 10px;font-size:12px;color:#5a3218;white-space:pre-line;max-width:38vw;line-height:1.5}
.teacherLog button{display:block;margin-top:6px;background:#fff3d6;border:1.5px solid #7a4a22;border-radius:6px;padding:3px 8px;font-size:12px;color:#5a3218}
.teacherLog .sync{margin-top:4px;color:#2e7d32}
.teacherLog .sync.bad{color:#c0392b;font-weight:800}

/* 해설 자막판 (위쪽) · 교사용 표시 */
#caption{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:1.5vh;z-index:15;background:rgba(255,253,245,.95);color:var(--ink);font-size:min(4.2vh,3vw);font-weight:900;line-height:1.3;padding:1vh 2.4vw;border-radius:2.5vmin;border:.6vmin solid #b8733a;box-shadow:0 .8vmin 0 rgba(0,0,0,.15);max-width:min(56vw,calc(100vw - 340px));text-align:center;word-break:keep-all;pointer-events:none;animation:popIn .3s both}
#caption:empty{display:none}
#chapLabel{position:absolute;left:1vw;bottom:1vh;z-index:15;background:rgba(255,255,255,.75);color:#5a3218;font-size:min(1.8vh,12px);padding:3px 9px;border-radius:8px;pointer-events:none;max-width:60vw}
#chapLabel:empty{display:none}
#tbar{position:absolute;right:1vw;bottom:1vh;z-index:30;display:flex;gap:8px;opacity:.6}
#tbar:hover,#tbar:focus-within{opacity:1}
#tbar button{position:relative;width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.88);border:2px solid #7a4a22;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
#tbar svg{width:22px;height:22px;position:relative;z-index:1}
#tbar small{position:relative;z-index:1;font-size:8px;color:#c0392b;line-height:1}

/* 사회적 상황 이야기 책 */
.book{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center}
.bk-page{position:relative;width:min(80vw,140vh);height:min(86vh,62vw);background:#fffdf5;border:1.2vmin solid #b8733a;border-radius:4vmin;box-shadow:0 1.6vmin 0 #7a4a22,0 3vh 6vh rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.bk-page.turn{animation:turnIn .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes turnIn{0%{transform:translateX(4vw) rotateY(-12deg);opacity:.2}100%{transform:none;opacity:1}}
.bk-art{position:relative;flex:1 1 auto;min-height:0;margin:2vmin 2vmin 0;border-radius:3vmin;background:linear-gradient(#c9f2ff,#eaffdc 66%,#b9e59a 66%,#a3d985);overflow:hidden}
.bk-ch{position:absolute;bottom:3%;height:90%;aspect-ratio:200/240}
.bk-ch.l{left:10%} .bk-ch.r{right:10%} .bk-ch.c{left:0;right:0;margin:auto}
.bk-ch .inner svg{width:100%;height:100%}
.bk-ic{position:absolute;left:0;right:0;margin:auto;top:6%;width:min(22vh,16vw)}
.bk-ic.side{left:auto;right:12%;margin:0;top:10%}
.bk-ic svg,.bk-ic img{width:100%;height:auto;display:block}
.bk-text{flex:0 0 auto;min-height:24%;display:flex;align-items:center;justify-content:center;padding:1.4vh 9vw 3.4vh;font-size:min(5.6vh,3.8vw);font-weight:900;color:var(--ink);text-align:center;word-break:keep-all;line-height:1.3}
.bk-page.title .bk-text{font-size:min(8vh,5.6vw);color:#b8733a}
.bk-tag{position:absolute;top:3vmin;left:3.5vmin;font-size:12px;background:rgba(255,255,255,.9);border:1px solid #d7b88a;border-radius:8px;padding:2px 8px;color:#7a4a22;pointer-events:none}
.bk-tag:empty{display:none}
.bk-say{position:absolute;right:2.2vmin;bottom:2.2vmin;width:min(9vh,7vw);aspect-ratio:1;border-radius:50%;background:#4fc3f7;border:.6vmin solid #fff;box-shadow:0 .8vmin 0 #2b8fc4;display:flex;align-items:center;justify-content:center}
.bk-say svg{width:62%}
.bk-dots{position:absolute;left:0;right:0;bottom:1.4vh;display:flex;justify-content:center;gap:6px;pointer-events:none}
.bk-dots i{width:1.4vmin;height:1.4vmin;border-radius:50%;background:#e3cfa8}
.bk-dots i.on{background:#b8733a;transform:scale(1.4)}
.bk-nav{position:absolute;top:50%;width:min(14vh,9vw);aspect-ratio:1;margin-top:calc(min(14vh,9vw) / -2);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe082,#ffb300 70%);border:.9vmin solid #fff;box-shadow:0 1vmin 0 #c77800,0 2vh 3vh rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:6}
.bk-nav svg{width:55%;margin-left:8%}
.bk-prev{left:1.2vw;transform:scaleX(-1)} .bk-next{right:1.2vw}
.book.read .bk-next{animation:pulse 1s ease-in-out infinite}
.bk-next.go{width:auto;height:auto;aspect-ratio:auto;margin-top:0;transform:translateY(-50%);padding:1.4vh 2vw;border-radius:5vmin;gap:.6vw;background:radial-gradient(circle at 35% 30%,#a8f584,#3fb43a 70%);box-shadow:0 1vmin 0 #2a8a2a;flex-direction:column}
.bk-next.go svg{width:min(8vh,6vw)}
.bk-next.go span{font-size:min(2.6vh,15px);color:#fff;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap}
.book.read .bk-next.go{animation:pulseY 1s ease-in-out infinite}
@keyframes pulseY{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.08)}}

/* 상황 고르기 */
.menu-h{position:absolute;top:3vh;left:0;right:0;margin:auto;width:max-content;padding:1.4vh 5vw;font-size:min(6vh,4.6vw);font-weight:900;z-index:4;animation:popIn .5s cubic-bezier(.3,1.5,.5,1) both}
.mgrid{position:absolute;top:18vh;bottom:9vh;left:5vw;right:5vw;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:2.6vmin;align-content:center;z-index:4}
.mcard{position:relative;background:#fffdf5;border-radius:4vmin;border:1vmin solid #e7a955;box-shadow:0 1.2vmin 0 #b9772f,0 2vh 3vh rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:1.5vmin;min-height:0;animation:cardIn .5s cubic-bezier(.3,1.5,.5,1) both}
.mcard.done{background:#f1ffe8;border-color:#7ed957;box-shadow:0 1.2vmin 0 #4caf50,0 2vh 3vh rgba(0,0,0,.2)}
.mcard.picked{animation:chosen .6s cubic-bezier(.3,1.6,.5,1) both;border-color:#55c24a}
.mc-ic{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.mc-ic > svg,.mc-ic > img{height:100%;width:auto;max-width:100%;display:block}
.mface{height:100%;aspect-ratio:200/240} .mface svg{width:100%;height:100%}
.mc-t{font-size:min(3.6vh,2.6vw);font-weight:900;color:#5a3218;text-align:center;word-break:keep-all;line-height:1.2}
.mc-done{position:absolute;top:-2.4vmin;right:-2.4vmin;width:min(11vh,8vw);animation:stamp .5s both}
.mc-done svg{width:100%;height:auto;display:block}
.mc-quick{position:absolute;left:1.6vmin;top:1.4vmin;font-size:11px;background:rgba(255,255,255,.95);border:1.5px solid #7a4a22;border-radius:8px;padding:2px 7px;color:#5a3218}
.menu-end{position:absolute;right:3vw;top:3vh;z-index:5;display:flex;flex-direction:column;align-items:center;gap:.6vh;opacity:.55}
.menu-end.ready{opacity:1}
.menu-end .ab{width:min(12vh,9vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc107 70%);border:.9vmin solid #fff;box-shadow:0 1vmin 0 #c79100;display:flex;align-items:center;justify-content:center}
.menu-end.ready .ab{animation:pulse 1.3s ease-in-out infinite}
.menu-end .ab svg{width:64%}
.menu-end span{font-size:min(2.6vh,15px);color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.7)}

/* 책상 소품 (퍼즐·색칠) · 질문 카드 */
.desk{position:absolute;left:calc(50% - min(14vh,11vw));bottom:5vh;width:min(28vh,22vw);z-index:4}
.desk svg{width:100%;height:auto;display:block}
.desk.tap-me::after{content:"";position:absolute;inset:-8%;border-radius:4vmin;border:1vmin dashed #fff;box-shadow:0 0 0 .6vmin rgba(255,224,0,.7);animation:pulse 1s ease-in-out infinite}
.pz{transform-box:fill-box;transform-origin:center;animation:wiggle 1s ease-in-out infinite}
.qcard{background:#fff;border:.6vmin solid var(--ink);border-radius:2vmin;padding:8%}
.qcard svg{width:100%;height:auto;display:block}
.layer > img{width:100%;height:auto;display:block}
.cc-icon img,.gate-icon img{width:100%;height:auto;display:block}

/* 1단계 기분 막대 */
.meter{position:absolute;left:1.5vw;bottom:12vh;width:4.5vmin;height:32vh;background:#fff;border:.6vmin solid var(--ink);border-radius:3vmin;overflow:hidden;z-index:4;animation:popIn .4s both}
.meter i{position:absolute;left:0;right:0;bottom:0;height:0;background:#ef5350;transition:height .8s ease,background .8s}

/* 4단계 먼저-다음 판 */
.ftboard{position:absolute;left:0;right:0;margin:auto;width:max-content;top:17vh;display:flex;align-items:center;gap:2vw;padding:1.6vh 3vw;z-index:5;animation:popIn .4s both}
.ft-item{position:relative;width:min(17vh,13vw);aspect-ratio:1;border-radius:50%;background:#fff8e6;padding:1.2vmin;opacity:.45;filter:grayscale(.5);transition:.4s}
.ft-item.on{opacity:1;filter:none;transform:scale(1.12);box-shadow:0 0 0 1vmin #ffe14d}
.ft-item > svg:not(.ring),.ft-item > img{width:100%;height:100%;display:block}
.ft-arrow{font-size:min(8vh,6vw);color:#fff8e6}
.ring{position:absolute;inset:-8%;width:116%;height:116%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:rgba(255,255,255,.6);stroke-width:7}
.ring circle.p{stroke:#29b6f6;stroke-dasharray:283;animation:ring linear forwards}
.ft-item:not(.on) .ring{display:none}
@keyframes ring{from{stroke-dashoffset:0}to{stroke-dashoffset:283}}

/* 교사 게이트: 말 버튼 · 반응 기록 */
.chips{flex-wrap:wrap;justify-content:center;max-width:min(46vw,calc(100vw - 520px));row-gap:1.4vh}
.chips.small .chip{font-size:min(6.5vh,5vw)}
.gate-aac{width:min(24vh,20vw);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 1.2vmin 0 rgba(0,0,0,.2);animation:pulse 1.2s ease-in-out infinite}
.gate-aac svg,.gate-aac img{width:100%;height:100%;display:block}
.gate-aac.hit{animation:hit .4s ease-out}
.resp{position:fixed;top:1.2vh;right:1.2vw;z-index:40;display:flex;flex-direction:column;gap:5px;width:150px}
.resp-h{font-size:11px;color:#fff;text-shadow:0 1px 2px #000;text-align:center}
.resp button{position:relative;overflow:hidden;background:rgba(255,255,255,.95);border:2px solid #7a4a22;border-radius:10px;padding:6px 8px;font-size:13px;color:#5a3218;text-align:left}
.resp button.skip{text-align:center;background:rgba(255,243,214,.95);font-size:12px}

/* 말 버튼 보드 */
.aacboard{position:absolute;top:10vh;bottom:7vh;left:3vw;right:3vw;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:2.5vmin;z-index:5}
.aacbtn{background:#fffdf5;border-radius:4vmin;border:1vmin solid #e7a955;box-shadow:0 1.2vmin 0 #b9772f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;min-height:0;padding:1.5vmin}
.aacbtn .ai{flex:1 1 0;min-height:0;width:100%}
.aacbtn .ai svg,.aacbtn .ai img{width:100%;height:100%;display:block;object-fit:contain}
.aacbtn .at{font-size:min(4.4vh,3.2vw);font-weight:900;color:#5a3218}
.aacbtn.hit{animation:hit .4s ease-out}
.aacbtn:active{transform:translateY(.6vmin);box-shadow:0 .6vmin 0 #b9772f}

/* 교사 창 (설정·기록·음성 목록) */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(25,40,20,.55)}
#modal.show{display:flex}
.mpanel{background:#fffaf0;border:3px solid #7a4a22;border-radius:16px;padding:16px 20px;width:min(900px,94vw);max-height:92vh;overflow:auto;color:var(--ink);font-size:14px;line-height:1.5;user-select:text;-webkit-user-select:text}
.mpanel h2{margin:0 0 10px;font-size:20px} .mpanel h3{margin:14px 0 4px;font-size:15px}
.mpanel small{font-weight:400;opacity:.7;font-size:12px}
.mrow{display:flex;gap:10px;align-items:flex-start;margin:9px 0}
.mrow > b{flex:0 0 78px;padding-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{border:2px solid #d7b88a;background:#fff;border-radius:10px;padding:6px 12px;font-size:14px;color:#5a3218}
.opt.on{background:#ffe066;border-color:#f4a91d;font-weight:800}
.mpanel input,.mpanel select{font:inherit;font-size:15px;padding:6px 10px;border:2px solid #d7b88a;border-radius:10px;background:#fff;color:var(--ink);min-width:220px;user-select:text;-webkit-user-select:text}
.mpanel input[type=url]{min-width:min(520px,70vw)}
.mpanel details{margin-top:10px;border-top:1px dashed #d7b88a;padding-top:6px}
.mpanel summary{cursor:pointer;font-weight:800}
.mstat{font-size:12px;color:#2e7d32}
.mnote{background:#fff3d6;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0;white-space:pre-line}
.mwarn{color:#c0392b;font-weight:800}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.mbtns button{border:2px solid #7a4a22;background:#fff;border-radius:10px;padding:8px 16px;font-size:14px;color:#5a3218}
.mbtns .mok{background:#7ed957;font-weight:800}
.mbtns .mdel{border-color:#c0392b;color:#c0392b;margin-right:auto}
table.rt{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
.rt th,.rt td{border:1px solid #e3cfa8;padding:4px 6px;text-align:left;vertical-align:top}
.rt th{background:#fff3d6}
.rt code{font-size:12px;word-break:break-all}
.dots{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1.5px solid rgba(0,0,0,.25);vertical-align:middle}
.d-self{background:#43a047}.d-imit{background:#9ccc65}.d-aac{background:#42a5f5}.d-prompt{background:#ffa726}.d-none{background:#9e9e9e}.d-na{background:#fff}
.legend{font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin:4px 0}

@media (orientation:portrait){
  .choices{flex-direction:column;gap:3vh}
  .card{width:min(70vw,40vh)}
  .picks{top:36vh;gap:3vw}
  .gate-board{flex-direction:column;gap:2vh}
  .aacboard{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .bk-page{width:84vw;height:72vh}
  .mrow{flex-direction:column;gap:4px}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="stage"></div>
  <canvas id="confetti"></canvas>
  <div id="overlay"></div>
  <div id="chapLabel"></div>
  <div id="caption"></div>
  <div id="tbar">
    <button id="bSound" title="소리: 전체 켬 → 음성만 끔 → 전체 끔"></button>
    <button id="bFull" title="전체 화면"></button>
    <button id="bAac" title="말 버튼 (길게 누르기)"><span class="fill"></span></button>
    <button id="bHome" title="처음으로 (길게 누르기)"><span class="fill"></span></button>
  </div>
</div>
<div id="modal"></div>

<script>
'use strict';
/* =====================================================================
   CONFIG — 교사가 바꿀 수 있는 설정 (대사·난이도·진행 방식)
   ===================================================================== */
const CONFIG = {
  title: { top: '내 마음 말하기', main: '정글 모험!' },
  // 구글 시트의 탭 이름. 나중에 다른 상황 이야기를 만들면 여기만 바꾸면 새 탭이 자동으로 생깁니다.
  story: '거절·어려움 표현하기',
  tts: { rate: 0.88, pitch: 1.15, narratorPitch: 1.1 },  // 말 속도·높이 (0.1~2)
  sfxVolume: 0.8,           // 효과음 크기 (0~1)
  shuffleChoices: true,     // 정답 카드 위치를 매번 무작위로 (위치 암기 방지)
  hintAfterWrong: 2,        // 오답 n회 후 정답 카드 반짝임 (0 = 끔)
  teacherHoldMs: 600,       // 교사 버튼 길게 누르기 시간(ms). 0이면 한 번 터치
  showCaption: true,        // 화면 위쪽 해설 자막판
  showBubbleText: true,     // 캐릭터 말풍선에 대사 글자 보이기
  showTeacherLabels: true,  // 카드의 작은 설명 글씨
  // 구글 시트 웹앱 (설치 방법: 교사용_안내.md). 여기 적어 두면 교사 설정에서 매번 넣지 않아도 됩니다.
  // key는 파일에 적지 마세요(깃허브에 올리면 누구나 볼 수 있음). 기기마다 교사 설정에서 한 번 입력하면 기억합니다.
  sheet: { url: 'https://script.google.com/macros/s/AKfycbzYb0Y8hYNHYRrrU6VRe53ivibriY4XqI3uvAG-l9wqkIzDvc-Dwc8LitDcDMjXSRBnOg/exec', key: '' },
  // 녹음 음성 파일 폴더 (클로바더빙 등). 파일이 없으면 기기 음성(TTS)으로 읽어 줍니다.
  audioDir: 'audio',

  /* 학생 유형 — 교사 설정에서 고르면 단계·수준·오답 카드가 자동으로 맞춰집니다.
     stages: 기본 단계(1~6) / level: 표현 수준(1~4) / task3: 3단계 장면('puzzle' 어려운 과제, 'question' 어려운 질문)
     wrong: 단계별 오답 카드 — hurt(내 몸 아프게 하기) shout(소리 지르기) hold(꾹 참기) throw(던지기) push(밀기) */
  defaultType: 'base',
  types: {
    A: { name: 'A형 (손 깨물기·참기)', stages: [1, 2, 3, 6], level: 1, task3: 'puzzle',
         wrong: { 2: 'hurt', 3: 'hurt', 4: 'hurt', 5: 'hold', 6: 'hold' } },
    B: { name: 'B형 (소리·코 때리기)', stages: [1, 3, 4, 6], level: 2, task3: 'question',
         wrong: { 2: 'shout', 3: 'shout', 4: 'hurt', 5: 'shout', 6: 'hold' } },
    base: { name: '기본형 (전체)', stages: [1, 2, 3, 4, 5, 6], level: 3, task3: 'puzzle', wrong: {} }
  },

function eyes(m, o = {}) {
  const y = o.y ?? 90, dx = o.dx ?? 22, lid = o.lid ?? '#ccc';
  if (m === 'proud') {
    return [-1, 1].map(s => { const cx = 100 + s * dx; return `<path d="M${cx - 12} ${y + 4} Q ${cx} ${y - 10} ${cx + 12} ${y + 4}" ${STK}/>`; }).join('');
  }
  const r = m === 'surprised' ? 16 : 13, ry = r + 3, pr = m === 'surprised' ? 6 : 8;
  return [-1, 1].map(s => {
    const cx = 100 + s * dx;
    let e = `<ellipse cx="${cx}" cy="${y}" rx="${r}" ry="${ry}" fill="#fff" ${OL}/>`;
    e += `<circle cx="${cx + s}" cy="${y + 3}" r="${pr}" fill="#2b1a10"/><circle cx="${cx + 3}" cy="${y - 1}" r="3" fill="#fff"/>`;
    if (m === 'annoyed' || m === 'angry') {
      e += `<path d="M${cx - r - 1} ${y - 1} C ${cx - r - 1} ${y - ry - 6} ${cx + r + 1} ${y - ry - 6} ${cx + r + 1} ${y - 1} Z" fill="${lid}" ${OL}/>`;
    }
    return e;
  }).join('');

function brows(m, o = {}) {
  const y = (o.y ?? 90) - 27, dx = o.dx ?? 22;
  let a;
  if (m === 'worried') a = [[-13, 5, 9, -5], [13, 5, -9, -5]];
  else if (m === 'annoyed') a = [[-13, -4, 9, 4], [13, -4, -9, 4]];
  else if (m === 'angry') a = [[-14, -8, 9, 6], [14, -8, -9, 6]];
  else if (m === 'surprised') a = [[-12, -6, 10, -9], [12, -6, -10, -9]];

  return a.map(([x1, y1, x2, y2], i) => {
    const cx = 100 + (i ? dx : -dx);
    return `<path d="M${cx + x1} ${y + y1} L${cx + x2} ${y + y2}" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`;
  }).join('');
}

/* =====================================================================
   오디오: 효과음(Web Audio) + 음성(Web Speech TTS)
   ===================================================================== */
const $ = s => document.querySelector(s);
let AC = null, MASTER = null, NB = null;
let MUTE_TTS = false, MUTE_SFX = false, SOUND = 0;
const HAS_TTS = 'speechSynthesis' in window;
const TTS = { voice: null };
let CURRENT_U = null;

function pickVoice() {
  if (!HAS_TTS) return;
  const vs = speechSynthesis.getVoices() || [];
  const ko = vs.filter(v => /^ko/i.test(v.lang));
  let want = null;
  try { want = localStorage.getItem('ssr.voice'); } catch (e) {}
  TTS.list = ko;
  // 교사가 고른 목소리 → 자연스러운 신경망 음성(엣지 'Natural'·'Online') → 구글 → 기타
  TTS.voice = ko.find(v => v.name === want) || ko.find(v => /Natural|Online|Neural/i.test(v.name)) ||
    ko.find(v => /Google/i.test(v.name)) || ko.find(v => /Yuna|SunHi|Heami|Samsung|female/i.test(v.name)) || ko[0] || null;
  TTS.count = vs.length;
  // 역할별 기본 목소리: 자연 음성이 여러 개면 역할마다 다르게 (선생님은 남자 목소리 우선)
  const good = ko.filter(v => /Natural|Online|Neural/i.test(v.name));
  const pool = good.length ? good : ko;
  const male = pool.filter(v => /InJoon|Hyunsu|BongJin|GookMin|Male|남/i.test(v.name));
  const fem = pool.filter(v => !male.includes(v));
  const f = i => fem[i] || fem[0] || pool[0] || null;
  TTS.auto = { '해설': f(0), '주인공': f(1), '친구': f(2) || f(1), '선생님': male[0] || f(0), '말버튼': f(0) };
}
const VOICE_ROLES = ['해설', '주인공', '친구', '선생님', '말버튼'];
function roleVoice(role) {
  let m = {};
  try { m = JSON.parse(localStorage.getItem('ssr.voices') || '{}'); } catch (e) {}
  const L = TTS.list || [];
  return L.find(v => v.name === m[role]) || (TTS.auto && TTS.auto[role]) || TTS.voice;
}
if (HAS_TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function unlockAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = AC.createGain(); MASTER.gain.value = CONFIG.sfxVolume; MASTER.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { /* 효과음 없이 진행 */ }
  if (HAS_TTS && !unlockAudio.done) {
    unlockAudio.done = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'ko-KR'; speechSynthesis.speak(u); } catch (e) {}
    pickVoice();
  }
}
document.addEventListener('pointerdown', unlockAudio, { capture: true });

function tone(f, d, { type = 'sine', vol = .3, at = 0, to = null, attack = .01 } = {}) {
  if (!AC || MUTE_SFX) return;
  const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + .05);
}
function noise(d, { vol = .2, at = 0, freq = 1200, to = null, q = 1 } = {}) {
  if (!AC || MUTE_SFX) return;
  if (!NB) {
    NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = NB.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + at, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
  if (to) f.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t); s.stop(t + d + .05);
}
const sfx = {
  pop() { tone(520, .14, { to: 920, vol: .25 }); },
  tap() { tone(700, .07, { type: 'triangle', vol: .18 }); },
  blip() { tone(880, .1, { type: 'triangle', vol: .2 }); tone(1320, .08, { vol: .1, at: .04 }); },
  hops(n = 4) { for (let i = 0; i < n; i++) tone(240, .14, { to: 540, vol: .18, at: i * .2 }); },
  whoosh() { noise(.4, { freq: 500, to: 2600, vol: .18 }); },
  correct() {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, { type: 'triangle', vol: .28, at: i * .09 }));
    tone(1568, .45, { vol: .12, at: .36 });
  },
  wrong() { tone(330, .22, { vol: .12 }); tone(262, .32, { vol: .1, at: .18 }); }, // 일부러 밋밋하게
  poke() { tone(190, .06, { type: 'square', vol: .07 }); noise(.05, { freq: 2600, vol: .08 }); },
  drum(n) { tone(160, .28, { to: 50, vol: .5 }); noise(.12, { freq: 900, vol: .18 }); tone(392 + n * 130, .28, { type: 'triangle', vol: .18, at: .02 }); },

/* 녹음 음성 파일: audio/역할/대사.mp3 → audio/대사.mp3 → 기기 음성(TTS) 순서로 찾음 */
const AUDIO_MISS = new Set();
let CUR_AUDIO = null;
// 파일 이름 = 대사에서 문장부호만 뺀 것 (예: "시끄러워요. 싫어요." → 시끄러워요 싫어요.mp3)
const cleanName = t => t.replace(/[\\/:*?"<>|#%.,!~…]/g, '').replace(/\s+/g, ' ').trim();
const audioPath = (text, role) => `${CONFIG.audioDir}/${role ? role + '/' : ''}${cleanName(text)}.mp3`;
function playFile(text, role) {
  if (!CONFIG.audioDir) return Promise.resolve(false);
  const paths = [role && audioPath(text, role), audioPath(text, '')].filter(p => p && !AUDIO_MISS.has(p));
  return new Promise(res => {
    const tryNext = () => {
      const p = paths.shift();
      if (!p) { res(false); return; }
      const a = new Audio(encodeURI(p));
      let state = 0;   // 0 여는 중 · 1 재생 중 · 2 끝
      const fail = miss => { if (state !== 0) return; state = 2; if (miss) AUDIO_MISS.add(p); tryNext(); };
      const done = () => { if (state === 2) return; state = 2; if (CUR_AUDIO === a) CUR_AUDIO = null; res(true); };
      a.onerror = () => (state === 0 ? fail(true) : done());
      a.onended = done;
      a.play().then(() => { if (state !== 0) return; state = 1; CUR_AUDIO = a; a._stop = done; }).catch(() => fail(false));
    };
    tryNext();
  });
}
function speakTTS(text, v, est) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const vc = roleVoice(v.role);
    u.lang = 'ko-KR'; if (vc) u.voice = vc;
    u.rate = v.rate ?? CONFIG.tts.rate; u.pitch = v.pitch ?? CONFIG.tts.pitch; u.volume = v.volume ?? 1;
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(gt); res(); };
    const gt = setTimeout(fin, est + 3000);   // onend가 안 오는 기기 대비
    u.onend = fin; u.onerror = fin;
    CURRENT_U = u;                           // 일부 크롬 GC 버그 방지
    setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { fin(); } }, 80);
  });
}
function stopVoice() {
  try { if (HAS_TTS) speechSynthesis.cancel(); } catch (e) {}
  const a = CUR_AUDIO;
  if (a) { CUR_AUDIO = null; try { a.pause(); } catch (e) {} if (a._stop) a._stop(); }
}
/* v.el: 말하는 캐릭터(말풍선 표시) · v.keep: 이미 띄운 말풍선 유지 · v.role: 해설/주인공/친구/선생님/말버튼 */
function say(text, v = {}) {
  const role = v.role || '';
  let bub = null;
  if (v.el) {
    setCaption('');
    if (!v.keep && CONFIG.showBubbleText) bub = bubble(v.el, { text });
  } else if (role === '해설' && !v.noCap) setCaption(text);
  const est = Math.max(900, text.length * 230 / (v.rate ?? CONFIG.tts.rate));
  return new Promise(res => {
    const fin = () => { if (bub) { const b = bub; setTimeout(() => b.remove(), 700); } res(); };
    stopVoice();
    if (MUTE_TTS) { setTimeout(fin, est); return; }
    playFile(text, role).then(ok => {
      if (ok) fin();
      else if (!HAS_TTS) setTimeout(fin, est);
      else speakTTS(text, v, est).then(fin);
    });
  });
}

function makeCtx(id) {
  const ctx = {
    alive: () => id === RUN,
    check() { if (id !== RUN) throw ABORT; },
    async sleep(ms) { await new Promise(r => setTimeout(r, ms)); ctx.check(); },
    async say(t, o) { await say(t, o); ctx.check(); },
    tap(el) {

    },
    every(ms, fn) {
      const t = setInterval(() => { if (id !== RUN) { clearInterval(t); return; } fn(); }, ms);
      TIMERS.push(t); return () => clearInterval(t);
    }
  };
  return ctx;
}

    setTimeout(() => { fired = false; if (fill) fill.style.transform = 'scaleX(0)'; }, 500);
  };

    const p = Math.min(1, (performance.now() - t0) / ms);
    if (fill) fill.style.transform = `scaleX(${p})`;
    if (p >= 1) { fire(); return; }
    raf = requestAnimationFrame(step);
  };

        busy = false;
      }
    }));
  });
}

   ===================================================================== */
const ST_KIND = { '설명': 'D', '조망': 'D', '긍정': 'D', '코칭': 'C' };
function storyRatio(pages) {
  const d = pages.filter(p => ST_KIND[p[0]] === 'D').length, k = pages.filter(p => ST_KIND[p[0]] === 'C').length;
  return { d, k, r: d / Math.max(1, k) };
}
function friendOf(n) {
  return n === 1 ? (CONFIG.s1.friend || 'pipi') : n === 2 ? (CONFIG.s2.friend || others()[1]) : n === 5 ? others()[0] : others()[1];
}
function artIcon(k) {
  if (AAC_ICON[k]) return aacIcon(k);
  if (k === 'puzzle') return puzzleSVG(false);
  if (k === 'paper') return paperSVG(false);
  return ICON[k] || ITEMS[k] || '';
}
function pageArt(spec, n) {
  const P = Object.fromEntries(String(spec || '').split(/\s+/).filter(Boolean).map(s => s.split('=')));
  const who = w => w === 'hero' ? STATE.hero : w === 'teacher' ? TEACHER : w === 'friend' ? friendOf(n) : (CHARS[w] ? w : STATE.hero);
  const ch = (v, cls) => { const [w, m = 'happy', pose = ''] = v.split(':'); return `<div class="bk-ch ${cls}"><div class="inner bob ${pose}">${charSVG(who(w), m)}</div></div>`; };
  return (P.l ? ch(P.l, 'l') : '') + (P.c ? ch(P.c, 'c') : '') + (P.r ? ch(P.r, 'r') : '') +
    (P.i ? `<div class="bk-ic${P.c ? ' side' : ''}">${artIcon(P.i)}</div>` : '');
}
/* 책 넘기기: 한 쪽에 한 문장, 읽어 준 뒤 학생이 ▶를 눌러 넘김 */
async function storyBook(c, { n = 0, title, art, pages, last }) {
  const all = [['제목', title, art]].concat(pages);
  const rt = storyRatio(pages);
  const bk = document.createElement('div'); bk.className = 'book';
  bk.innerHTML = `<div class="bk-page"><div class="bk-art"></div><div class="bk-text"></div><div class="bk-tag"></div>
      <button class="bk-say" data-nav="say" aria-label="다시 듣기">${ICON.speaker}</button><div class="bk-dots"></div></div>
    <button class="bk-nav bk-prev" data-nav="prev" aria-label="앞으로">${ICON.play}</button>
    <button class="bk-nav bk-next" data-nav="next" aria-label="다음">${ICON.play}</button>`;
  stage.appendChild(bk);
  const pg = bk.querySelector('.bk-page'), nx = bk.querySelector('.bk-next');
  const nav = () => new Promise(res => {
    const h = e => { const b = e.target.closest('[data-nav]'); if (!b) return; e.preventDefault(); bk.removeEventListener('pointerdown', h); res(b.dataset.nav); };
    bk.addEventListener('pointerdown', h);
  }).then(v => { c.check(); return v; });
  let i = 0;
  for (;;) {
    const [kind, text, a] = all[i];
    const lastPage = i === all.length - 1;
    pg.classList.toggle('title', i === 0);
    bk.querySelector('.bk-art').innerHTML = pageArt(a, n);
    bk.querySelector('.bk-text').textContent = tpl(text);
    bk.querySelector('.bk-tag').textContent = !CONFIG.showTeacherLabels ? '' : i === 0
      ? `설명·조망·긍정 ${rt.d} ÷ 코칭 ${rt.k} = ${rt.r.toFixed(1)} ${rt.r >= 2 ? '✓' : '(2 이상 필요)'}`
      : `${i === 1 ? '도입 · ' : lastPage ? '결론 · ' : ''}${kind}문`;
    bk.querySelector('.bk-dots').innerHTML = all.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('');
    bk.querySelector('.bk-prev').style.visibility = i ? 'visible' : 'hidden';
    nx.classList.toggle('go', lastPage);
    nx.innerHTML = lastPage ? `${ICON.play}<span>${last}</span>` : ICON.play;
    retrigger(pg, 'turn'); bk.classList.remove('read');
    c.say(tpl(text), narr({ noCap: true })).then(() => bk.classList.add('read'), () => {});
    const a2 = await nav();
    stopVoice(); sfx.tap();
    if (a2 === 'prev') i = Math.max(0, i - 1);
    else if (a2 === 'next') { if (lastPage) break; i++; }
  }
  bk.remove();
}

/* ---------- 교사 게이트 (따라 말하기 + 반응 기록) ---------- */
function teacherGate(c, n, phrase) {
  const log = stLog(n), icon = aacIcon(aacOf(n)), btnMode = LV() === 1, pose = poseOf(n);
  const note = CONFIG.gateNote[pose === 'pose-x' ? 'x' : 'raise'][btnMode ? 1 : 'n'];
  log.ph = phrase;
  return new Promise(resolve => {
    overlay.className = 'show dim';
    const chips = btnMode ? [phrase] : chipsOf(phrase);
    const small = chips.length > 3 || chips.join('').length > 7;
    const g = document.createElement('div'); g.className = 'gate';
    g.innerHTML = `<div class="gate-board">
        <div class="gate-hero"><div class="inner bob ${pose}">${charSVG(STATE.hero, 'talk')}</div></div>
        <div class="gate-right">
          ${btnMode ? `<button class="gate-aac" aria-label="${esc(phrase)}">${icon}</button>` : `<div class="gate-icon">${icon}</div>`}
          <div class="chips${small ? ' small' : ''}">${chips.map(s => `<span class="chip">${s}</span>`).join('')}</div>
          <button class="replay" aria-label="다시 듣기">${ICON.speaker}</button>
        </div>
      </div>`;
    const rp = document.createElement('div'); rp.className = 'resp';
    rp.innerHTML = `<div class="resp-h">교사 기록 · ${CONFIG.teacherHoldMs > 0 ? '길게 누르기' : '터치'} · 숫자키 1~5</div>` +
      RESP.map(([k, t], i) => `<button data-r="${k}"><span class="fill"></span><span class="lbl">${i + 1}. ${t}</span></button>`).join('') +
      `<button data-r="" class="skip"><span class="fill"></span><span class="lbl">기록 없이 다음 ➔</span></button>`;
    overlay.appendChild(g); overlay.appendChild(rp);
    sfx.pop();
    const chipEls = [...g.querySelectorAll('.chip')];
    const aacBtn = g.querySelector('.gate-aac');
    let playing = false, closed = false;
    async function model(first) {
      if (playing || closed) return;
      playing = true; g.classList.remove('listening');
      try {
        if (first) { await c.say(note, narr()); if (closed) throw ABORT; }
        if (!btnMode) {
          for (const el of chipEls) {
            el.classList.add('lit'); sfx.blip();
            await c.say(el.textContent, voiceOf(STATE.hero, { rate: .75 }));
            if (closed) throw ABORT;
          }
          await c.sleep(150);
        }
        chipEls.forEach(e => e.classList.add('lit'));
        if (aacBtn) retrigger(aacBtn, 'hit');
        await c.say(phrase, voiceOf(STATE.hero, { rate: .85 }));
        if (closed) throw ABORT;
        chipEls.forEach(e => e.classList.remove('lit'));
        g.classList.add('listening');
      } catch (e) { /* 중단 */ }
      playing = false;
    }
    if (aacBtn) aacBtn.addEventListener('pointerdown', async e => {
      e.preventDefault();
      if (closed) return;
      log.aac++; sfx.blip(); retrigger(aacBtn, 'hit');
      if (playing) return;
      playing = true; chipEls.forEach(x => x.classList.add('lit'));
      await say(phrase, voiceOf(STATE.hero));
      chipEls.forEach(x => x.classList.remove('lit'));
      playing = false;
    });
    g.querySelector('.replay').addEventListener('pointerdown', e => { e.preventDefault(); sfx.tap(); model(false); });
    const finish = code => {
      if (closed) return; closed = true; GATE_PICK = null;
      log.resp = code || null; log.done = true;
      stopVoice();
      sfx.correct(); overlay.innerHTML = ''; overlay.className = '';
      resolve();
    };
    const fires = {};
    rp.querySelectorAll('button').forEach(b => { fires[b.dataset.r] = holdButton(b, CONFIG.teacherHoldMs, () => finish(b.dataset.r)); });
    GATE_PICK = k => fires[k] && fires[k]();
    model(true);
  });
}

/* =====================================================================
   [1단계] 내 마음 알기 — 기분 알기 → 팔로 X → 숨쉬기 → "싫어요"
   ===================================================================== */
async function s1(c) {
  const S = CONFIG.s1, n = 1, H = STATE.hero, F = S.friend || 'pipi';
  await stageStart(c, n);
  const hero = makeChar(H, { pos: 'left' }); setAnim(hero, 'bob'); setMove(hero, 'enter-left'); sfx.hops(3);
  await c.sleep(900);
  const fr = makeChar(F, { pos: 'right' }); setMove(fr, 'enter-right'); sfx.hops(4);
  await c.sleep(1350);
  setMove(fr, ''); setMood(fr, 'proud'); setAnim(fr, 'cheer');
  let singing = true;
  const noteOnce = () => {
    if (!singing) return;
    const r = fr.getBoundingClientRect();
    floatIcon(r.left + r.width * (.15 + Math.random() * .4), r.top + r.height * .1, ICON.note);
    tone(660 + Math.random() * 520, .16, { type: 'square', vol: .04 });
  };
  const stopNotes = c.every(700, noteOnce); noteOnce();
  await c.say(S.intro, narr());
  setMood(fr, 'talk');
  await c.say(S.friendLine, V(fr, { rate: 1.05 }));
  setMood(fr, 'proud');
  setMood(hero, 'annoyed'); setAnim(hero, 'shake-no'); emote(hero, ICON.loud);
  const m = meter(90);
  await c.say(S.heroFeel, V(hero));
  setAnim(hero, 'bob');

  // ① 내 기분 알기
  await c.say(tpl(S.faceQ), narr());
  await choose(c, { log: stLog(n), wrong: artFace('happy'), right: artFace('annoyed'), wrongLine: S.faceWrong, wrongLabel: '(웃는 얼굴)', rightLabel: '(기분 나쁜 얼굴)' });
  sfx.blip();

  // ② 팔로 X — 손이 입·코로 가기 전에 먼저 몸을 멈추는 대체 동작
  const xb = bigButton(aacIcon('cant'), '팔로 X', 52, 42);
  await c.say(S.xQ, narr());
  xb.classList.add('ready');
  await c.tap(xb);
  retrigger(xb, 'hit'); sfx.drum(0); xb.classList.add('done');
  setMood(hero, 'worried'); setAnim(hero, 'pose-x'); m.set(65);
  await c.say(S.xDone, narr());
  xb.remove();

  // ③ 숨쉬기
  const wb = bigButton(ICON.wind, '숨 쉬기', 52, 42);
  await c.say(S.breathQ, narr());
  wb.classList.add('ready');
  for (let i = 0; i < S.breaths; i++) {
    await c.tap(wb);
    wb.classList.add('busy'); retrigger(wb, 'hit'); sfx.whoosh();
    retrigger(inner(hero), 'breathe');
    const r = hero.getBoundingClientRect();
    floatIcon(r.left + r.width * .7, r.top + r.height * .35, ICON.wind);
    m.set(65 - (i + 1) * 50 / S.breaths);
    await c.say(S.breath, V(hero, { rate: .7 }));
    wb.classList.remove('busy', 'hit');
  }
  wb.classList.add('done');
  setMood(hero, 'happy'); setAnim(hero, 'bob');
  await c.say(S.calmDone, narr());
  wb.remove();

  // ④ 팔로 X + 말로 알리기
  const phrase = lv(S.say);
  await heroSays(c, hero, n, phrase);
  singing = false; stopNotes();
  setMood(fr, 'surprised'); setAnim(fr, '');
  await c.sleep(300);
  setMood(fr, 'happy'); setAnim(fr, 'bob');
  await c.say(lv(S.friendOk), V(fr));
  removeBubble(hero); m.el.remove();
  setMood(hero, 'proud'); setAnim(hero, 'jump'); sparkle(hero); sfx.sparkle();
  await c.say(S.praise, narr());
  setAnim(hero, 'bob');

  await teacherGate(c, n, phrase);
  next();

function saveSession() {
  const L = STATE.log;
  if (L.saved) return L.saved;
  const st = Object.keys(L.st).map(Number).sort((a, b) => a - b)
    .map(n => { const s = L.st[n]; return { n, ph: s.ph, r: s.resp, w: s.wrong, h: s.hint, a: s.aac, done: s.done }; });
  if (!st.some(s => s.done)) return (L.saved = { rec: null });
  const S = STATE.setup;
  const rec = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    d: new Date(L.t0).toISOString(), nm: S.name || '(이름 없음)', tk: S.type, tn: T().name, lv: S.level, hero: STATE.hero,
    sec: Math.round(((L.end || Date.now()) - L.t0) / 1000), st: st.filter(s => s.done)
  };
  const all = loadRecs();
  const prev = [...all].reverse().find(r => r.nm === rec.nm) || null;
  all.push(rec);
  while (all.length > 800) all.shift();
  const ok = store.set(KEY.recs, all);
  enqueue({ sheet: CONFIG.story, rows: sheetRows(rec) });
  return (L.saved = { rec, prev, ok });
}
function sessionText({ rec, prev, ok }) {
  const lines = [`${fmtDate(rec.d)} · ${rec.nm} · ${rec.tn} · 수준 ${rec.lv}(${LEVEL_NAMES[rec.lv]}) · 주인공 ${CHARS[rec.hero].name}`];
  rec.st.forEach(s => lines.push(`${s.n}단계 ${STAGES[s.n].name}: ${RESP_LABEL[s.r] || '미기록'} · 오답 ${s.w}회${s.h ? '(힌트)' : ''}${s.a ? ` · 버튼 ${s.a}회` : ''}`));
  const self = r => r.st.filter(s => s.r === 'self').length;
  let cmp = `혼자 동작+말 ${self(rec)}/${rec.st.length}단계`;
  if (prev) { const a = self(rec), b = self(prev); cmp += ` (지난번 ${b}/${prev.st.length} ${a > b ? '▲' : a < b ? '▼' : '='})`; }
  lines.push(cmp, `총 소요 ${Math.floor(rec.sec / 60)}분 ${rec.sec % 60}초`);
  if (!ok) lines.push('※ 이 브라우저에는 기록이 저장되지 않았어요.');
  return lines.join('\n');
}

/* =====================================================================
   저장소 (이 기기) · 구글 시트 연동
   ===================================================================== */
const KEY = { setup: 'ssr.setup.v2', people: 'ssr.people.v2', recs: 'ssr.records.v2', aac: 'ssr.aac.v2', sheet: 'ssr.sheet.v2', queue: 'ssr.queue.v2', voice: 'ssr.voice' };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const loadRecs = () => store.get(KEY.recs, []);
function sheetCfg() {
  const s = store.get(KEY.sheet, {});
  return { url: (s.url || CONFIG.sheet.url || '').trim(), key: (s.key || CONFIG.sheet.key || '').trim() };
}
async function sheetCall(body) {
  const s = sheetCfg();
  if (!s.url) throw new Error('웹앱 주소가 없어요');
  const r = await fetch(s.url, { method: 'POST', body: JSON.stringify(Object.assign({ key: s.key }, body)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '실패');
  return j;
}
// 주소·키가 아직 없어도 기록은 모아 두었다가, 연결되면 한꺼번에 보냄
function enqueue(payload) {
  const q = store.get(KEY.queue, []); q.push(payload);
  while (q.length > 300) q.shift();
  store.set(KEY.queue, q);
  flushQueue();
}
let FLUSHING = null, SHEET_ERR = '';
function flushQueue() {
  if (FLUSHING) return FLUSHING.then(() => flushQueue());   // 보내는 중에 새로 쌓인 기록도 이어서 보냄
  const p = (async () => {
    let q = store.get(KEY.queue, []);
    const s = sheetCfg();
    if (q.length && !s.url) SHEET_ERR = '웹앱 주소가 없어요';
    else if (q.length && !s.key) SHEET_ERR = '비밀 키를 아직 넣지 않았어요';
    else {
      while (q.length) {
        try { await sheetCall(Object.assign({ action: 'append' }, q[0])); SHEET_ERR = ''; }
        catch (e) { SHEET_ERR = e.message === 'Failed to fetch' ? '인터넷 연결을 확인해 주세요' : e.message; break; }
        q = store.get(KEY.queue, []); q.shift(); store.set(KEY.queue, q);
      }
    }
    return store.get(KEY.queue, []).length;
  })();
  FLUSHING = p;
  p.finally(() => { if (FLUSHING === p) FLUSHING = null; });
  return p;
}
function sheetStatus(left) {
  if (!left) return SHEET_ERR ? `구글 시트: ${SHEET_ERR}` : '구글 시트에 저장했어요.';
  return `구글 시트로 못 보냄 (${left}건 대기): ${SHEET_ERR || '잠시 후 다시 보내요'} → 교사 설정 · 이름 → 구글 시트 연결에서 확인하면 자동으로 보내요.`;
}
function sheetRows(rec) {
  return rec.st.map(s => ({
    '회차ID': rec.id, '수행일시': rec.d, '이름': rec.nm, '유형': rec.tn, '수준': `${rec.lv} ${LEVEL_NAMES[rec.lv]}`,
    '단계': s.n, '단계명': STAGES[s.n].name, '목표 문장': s.ph, '반응': RESP_LABEL[s.r] || '미기록',
    '오답': s.w, '힌트': s.h ? 'O' : '', '버튼 누름': s.a || 0, '소요(초)': rec.sec, '주인공': CHARS[rec.hero] ? CHARS[rec.hero].name : rec.hero
  }));
}
function recsFromRows(rows) {
  const by = new Map();
  rows.forEach(r => {
    const id = String(r['회차ID'] || r['수행일시']);
    if (!by.has(id)) by.set(id, { id, d: r['수행일시'], nm: r['이름'], tn: r['유형'], lv: parseInt(r['수준'], 10) || 0, sec: +r['소요(초)'] || 0, st: [] });
    by.get(id).st.push({ n: +r['단계'], ph: r['목표 문장'], r: RESP_CODE[r['반응']] || null, w: +r['오답'] || 0, h: r['힌트'] === 'O', a: +r['버튼 누름'] || 0, done: true });
  });
  return [...by.values()];
}
function recsTSV(recs) {
  const rows = recs.flatMap(sheetRows);
  if (!rows.length) return '';
  const head = Object.keys(rows[0]).filter(k => k !== '회차ID');
  return [head.join('\t')].concat(rows.map(r => head.map(h => h === '수행일시' ? fmtDate(r[h]) : r[h]).join('\t'))).join('\n');
}

/* ---------- 교사 설정 창 ---------- */
function loadSetup() {
  const s = store.get(KEY.setup, null);
  const ok = s && CONFIG.types[s.type] && Array.isArray(s.stages) && s.level >= 1 && s.level <= 4;
  STATE.setup = Object.assign({ name: '' }, ok ? s : fromType(CONFIG.defaultType));
  STATE.setup.stages = STATE.setup.stages.filter(n => STAGES[n]);
  if (!STATE.setup.stages.length) STATE.setup.stages = [1];
}
function fromType(k) { const p = CONFIG.types[k]; return { type: k, stages: [...p.stages], level: p.level }; }
function saveSetup() {
  const S = STATE.setup;
  store.set(KEY.setup, S);
  if (S.name) { const pp = store.get(KEY.people, {}); pp[S.name] = { type: S.type, stages: S.stages, level: S.level, t: Date.now() }; store.set(KEY.people, pp); }
}
function setupNote() {
  const S = STATE.setup;
  const lines = [`수준 ${S.level}(${LEVEL_NAMES[S.level]}) 목표 문장 — ` + S.stages.map(n => `${n}단계 “${phraseOf(n)}”`).join(' / ')];
  const wr = S.stages.filter(n => n > 1).map(n => `${n}단계 ${CONFIG.wrongs[wrongOf(n)].label.replace(/[()]/g, '')}`);
  if (wr.length) lines.push('오답 카드 — ' + wr.join(' · '));
  if (S.stages.includes(3)) lines.push('3단계 장면 — ' + (taskOf3() === 'question' ? '어려운 질문 (몰라요)' : '어려운 과제 (어려워요)'));
  lines.push('거절(1·2·5단계, 6단계 첫 장면)은 팔로 X를 만들며 말하고, 어려움·쉬기·도움 요청(3·4·6단계)은 손을 들고 말해요.');
  lines.push('이야기 문장 비율 (설명·조망·긍정 ÷ 코칭, 기준 2 이상) — ' + S.stages.map(n => {
    const r = storyRatio(CONFIG.stories[n].pages); return `${n}단계 ${r.r.toFixed(1)}${r.r >= 2 ? ' ✓' : ' ⚠'}`;
  }).join(' · '));
  lines.push('고른 상황만 메뉴에 나오고, 학생이 하나씩 골라 “이야기 읽기 → 연습”을 해요.');
  return lines.join('\n');
}

}

/* ---------- 녹음 음성 파일 목록 (클로바더빙 등) ---------- */
const ROLE_OF = {
  intro: '해설', faceQ: '해설', faceWrong: '해설', xQ: '해설', xDone: '해설', breathQ: '해설', calmDone: '해설',
  praise: '해설', question: '해설', restLine: '해설', thenLine: '해설', stopQ: '해설',
  heroFeel: '주인공', heroLine: '주인공', say: '주인공', breath: '주인공', repeat: '주인공', stopWord: '주인공',
  friendLine: '친구', friendOk: '친구', friendSorry: '친구', friendAgain: '친구',
  teacherLine: '선생님', teacherOk: '선생님', answer: '선생님'
};
function voiceLines() {
  const out = [], seen = new Set();
  const add = (role, t) => { if (!t) return; const k = role + '|' + t; if (seen.has(k)) return; seen.add(k); out.push({ role, t }); };
  const names = HEROES.map(h => CHARS[h].name);
  const expand = (role, t) => /\{name\}/.test(t) ? names.forEach(x => add(role, t.replace(/\{name\}/g, x))) : add(role, t);
  const walk = o => Object.entries(o).forEach(([k, v]) => {
    const role = ROLE_OF[k]; if (!role) return;
    if (v && typeof v === 'object') Object.values(v).forEach(t => expand(role, t)); else expand(role, v);
  });
  const chipLines = v => [2, 3, 4].forEach(l => chipsOf(typeof v === 'object' ? (v[l] ?? v[1]) : v, l).forEach(ch => add('주인공', ch)));
  add('해설', `${CONFIG.title.top} ${CONFIG.title.main} 같이 갈 친구를 골라 볼까?`);
  HEROES.forEach(h => add('주인공', `나는 ${ya(CHARS[h].name)}! 같이 가자!`));
  add('해설', CONFIG.practiceLine); add('해설', CONFIG.menuLine);
  Object.values(CONFIG.stories).forEach(s => { add('해설', s.title); s.pages.forEach(p => expand('해설', p[1])); });
  const A = CONFIG.applause;
  [A.title, A.open, ...Object.values(A.lines), A.teacher, A.close].forEach(t => add('해설', t));
  [CONFIG.s1, CONFIG.s2, CONFIG.s3.puzzle, CONFIG.s3.question, CONFIG.s4, CONFIG.s5, CONFIG.s6].forEach(walk);
  add('해설', CONFIG.s3.ask);
  Object.values(CONFIG.wrongs).forEach(w => add('해설', w.line));
  Object.values(CONFIG.gateNote).forEach(g => Object.values(g).forEach(t => add('해설', t)));
  [CONFIG.s1, CONFIG.s2, CONFIG.s3.puzzle, CONFIG.s3.question, CONFIG.s4, CONFIG.s5, CONFIG.s6].forEach(o => chipLines(o.say));
  add('해설', CONFIG.ending.line);
  CONFIG.aac.forEach(a => add('말버튼', a.word));
  return out;
}

파일 이름은 대사에서 문장부호(. , ! ? ~ …)만 뺀 것이에요. ‘파일 경로’와 똑같이 맞춰 index.html 옆 audio 폴더에 넣으면, 그 대사는 녹음 음성으로 나와요. 없는 파일은 기기 음성으로 읽어요.
역할 폴더에 없으면 audio 폴더 바로 아래(예: audio/싫어요.mp3)도 찾아봐요. 무료로 쓸 때는 각 서비스의 이용 조건(출처 표기 등)을 확인해 주세요.</p>
    <table class="rt"><tr><th>역할</th><th>대사</th><th>파일 경로</th></tr>${rows}</table>

    else if (b.classList.contains('mok')) back ? back() : closeModal();
  };
}

/* ---------- 폭죽 ---------- */
function confetti(ms) {
  const cv = $('#confetti'), g = cv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#ff5a7a', '#ffd93b', '#4fc3f7', '#7ed957', '#b388ff', '#ff9f43'];
  const P = [];
  for (let i = 0; i < 170; i++) P.push({
    x: Math.random() * W, y: -Math.random() * H * .8 - 20, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3.5,
    r: Math.random() * 6.28, vr: (Math.random() - .5) * .25, w: 8 + Math.random() * 8, h: 6 + Math.random() * 8,
    c: cols[i % cols.length], circ: Math.random() < .3
  });
  const t0 = performance.now(), my = RUN;
  (function f(t) {
    g.clearRect(0, 0, W, H);
    if (my !== RUN) return;
    const el = t - t0; let alive = 0;
    for (const p of P) {
      p.vy += .03; p.x += p.vx + Math.sin(t / 400 + p.r) * .6; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 20) { if (el < ms) { p.y = -20; p.vy = 2 + Math.random() * 3; } else continue; }
      alive++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
      if (p.circ) { g.beginPath(); g.arc(0, 0, p.w / 2, 0, 6.28); g.fill(); }
      else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r)) + 2);
      g.restore();
    }
    if (alive) requestAnimationFrame(f); else g.clearRect(0, 0, W, H);
  })(t0);
}

});

holdButton($('#bHome'), 700, () => go(intro));
$('#bAac').insertAdjacentHTML('beforeend', ICON.chat);
holdButton($('#bAac'), 700, () => go(aacBoard));
document.addEventListener('keydown', e => {
  if (!GATE_PICK) return;
  if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') { e.preventDefault(); GATE_PICK(''); }
  else if (/^[1-5]$/.test(e.key)) { e.preventDefault(); GATE_PICK(RESP[+e.key - 1][0]); }
});
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('online', () => flushQueue());

buildBG();
applySound();
loadSetup();
flushQueue();
go(intro);
</script>
</body>
</html>
