<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>행동별 선택지 그림</title><style>body{margin:0;padding:24px;background:#f5f1e8;color:#384b35;font:17px/1.6 'Malgun Gothic',sans-serif}main{max-width:1150px;margin:auto}h1{font-size:28px}h2{margin-top:36px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0;background:#fffdf7;border:2px solid #d7c8b1;padding:16px;border-radius:20px}.right{border-color:#6a9d61}img{display:block;width:100%;height:270px;object-fit:contain}figcaption{text-align:center;margin-top:12px;font-size:16px}a{color:#276544}@media(max-width:700px){body{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}img{height:180px}figure{padding:8px}figcaption{font-size:12px}}</style><main><h1>동작이 구분되는 선택지</h1><p>팔 X는 거절 표현, 밀기는 두 팔을 앞으로 뻗어 상대를 미는 모습입니다. 각 캐릭터의 선택지는 서로 다른 그림을 사용합니다.</p><p><a href="index.html">수정 앱 열기</a></p><h2>몽</h2><div class="cards"><figure class="right"><img src="images/characters/mong-cross.png" alt="팔 X로 거절하는 몽"><figcaption>거절 표현: 가슴 앞 팔 X</figcaption></figure><figure><img src="images/actions/mong-push.png" alt="몽 밀기: 팔을 앞으로 뻗기"><figcaption>밀기: 팔을 앞으로 뻗기</figcaption></figure><figure><img src="images/actions/mong-throw.png" alt="몽 던지기: 놓인 물건의 이동"><figcaption>던지기: 놓인 물건의 이동</figcaption></figure><figure><img src="images/actions/mong-shout.png" alt="몽 큰 소리: 입을 벌려 외치기"><figcaption>큰 소리: 입을 벌려 외치기</figcaption></figure><figure><img src="images/actions/mong-hold.png" alt="몽 참기: 불편한 채 말하지 않기"><figcaption>참기: 불편한 채 말하지 않기</figcaption></figure><figure><img src="images/actions/mong-hurt.png" alt="몽 아픔: 반창고로 상징"><figcaption>아픔: 반창고로 상징</figcaption></figure></div><h2>루루</h2><div class="cards"><figure class="right"><img src="images/characters/ruru-cross.png" alt="팔 X로 거절하는 루루"><figcaption>거절 표현: 가슴 앞 팔 X</figcaption></figure><figure><img src="images/actions/ruru-push.png" alt="루루 밀기: 팔을 앞으로 뻗기"><figcaption>밀기: 팔을 앞으로 뻗기</figcaption></figure><figure><img src="images/actions/ruru-throw.png" alt="루루 던지기: 놓인 물건의 이동"><figcaption>던지기: 놓인 물건의 이동</figcaption></figure><figure><img src="images/actions/ruru-shout.png" alt="루루 큰 소리: 입을 벌려 외치기"><figcaption>큰 소리: 입을 벌려 외치기</figcaption></figure><figure><img src="images/actions/ruru-hold.png" alt="루루 참기: 불편한 채 말하지 않기"><figcaption>참기: 불편한 채 말하지 않기</figcaption></figure><figure><img src="images/actions/ruru-hurt.png" alt="루루 아픔: 반창고로 상징"><figcaption>아픔: 반창고로 상징</figcaption></figure></div><h2>부기</h2><div class="cards"><figure class="right"><img src="images/characters/boogi-cross.png" alt="팔 X로 거절하는 부기"><figcaption>거절 표현: 가슴 앞 팔 X</figcaption></figure><figure><img src="images/actions/boogi-push.png" alt="부기 밀기: 팔을 앞으로 뻗기"><figcaption>밀기: 팔을 앞으로 뻗기</figcaption></figure><figure><img src="images/actions/boogi-throw.png" alt="부기 던지기: 놓인 물건의 이동"><figcaption>던지기: 놓인 물건의 이동</figcaption></figure><figure><img src="images/actions/boogi-shout.png" alt="부기 큰 소리: 입을 벌려 외치기"><figcaption>큰 소리: 입을 벌려 외치기</figcaption></figure><figure><img src="images/actions/boogi-hold.png" alt="부기 참기: 불편한 채 말하지 않기"><figcaption>참기: 불편한 채 말하지 않기</figcaption></figure><figure><img src="images/actions/boogi-hurt.png" alt="부기 아픔: 반창고로 상징"><figcaption>아픔: 반창고로 상징</figcaption></figure></div></main></html>
